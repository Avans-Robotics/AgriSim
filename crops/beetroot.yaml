# Provisional values, to be tuned against real field data (spec section 6).
# Round red table beet (Detroit or Boltardy type) at harvest, matched by eye to photos:
# a top-shaped crimson globe 5 to 8 cm across, a third to half above the soil, 8 to 14
# red-magenta stalks with simple ovate green blades, foliage 30 to 40 cm tall.
name: beetroot
planting:
  row_spacing: 0.25      # two rows per 0.5 m Pixel
  in_row_spacing: 0.08
  margin: 0.05           # six Plants per row
  row_direction: 0.0
  jitter: 0.01
  missing_rate: 0.08
variation:
  scale: [0.85, 1.15]
  yaw: [0.0, 6.283]
  hue_shift: [-0.03, 0.03]
physics:
  pull_out_force: [30.0, 60.0]   # newtons, guess, no literature value for table beet yet
  pull_out_curve:                # ADR 0006
    d_peak: 0.005                # meters of root travel to the peak, guess
    residual_fraction: 0.3       # force right after the peak, fraction of the peak, guess
    pull_out_damping: 0.0        # N s/m, speed effect, off until measured
assets:
  library: assets/library/beetroot
  generator: beetroot
  variants: 24
